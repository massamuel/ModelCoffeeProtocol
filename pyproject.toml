[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelcoffeeprotocol"
version = "0.1.0"
description = "Coffee purchasing agent with FastAPI and FastMCP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "fastmcp==3.4.8", "httpx>=0.28,<1", "pydantic-ai-slim[anthropic,mcp]==1.107.7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.hatch.build.targets.wheel]
packages = ["modelcoffee"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
